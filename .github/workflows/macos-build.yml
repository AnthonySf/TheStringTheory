name: macOS build

on:
  workflow_dispatch:
    inputs:
      macos_archs:
        description: macOS architectures to build.
        required: true
        type: choice
        default: "x86_64;arm64"
        options:
          - "x86_64;arm64"
          - "arm64"
          - "x86_64"
      build_unity_player:
        description: Build the Unity macOS player. Requires Unity license secrets.
        required: true
        type: boolean
        default: false

jobs:
  native-plugins:
    name: Native plugins
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure CMake is available
        shell: bash
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Build macOS native plugins
        shell: bash
        env:
          MACOS_ARCHS: ${{ inputs.macos_archs }}
        run: bash Tools/Mac/build-macos-native-plugins.sh

      - name: Pack native plugins
        shell: bash
        run: tar -czf macos-native-plugins.tgz -C Assets/Plugins/macOS .

      - name: Upload native plugins
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-plugins
          path: macos-native-plugins.tgz
          if-no-files-found: error

  stem-runtime:
    name: Stem runtime (${{ matrix.rid }})
    if: ${{ inputs.build_unity_player }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14
          - rid: osx-x64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build stem runtime
        shell: bash
        run: bash Tools/Mac/build-macos-stem-runtime.sh "${{ matrix.rid }}" Temp/stem-runtime

      - name: Pack stem runtime
        shell: bash
        run: tar -czf "stem-runtime-${{ matrix.rid }}.tgz" -C Temp/stem-runtime "${{ matrix.rid }}"

      - name: Upload stem runtime
        uses: actions/upload-artifact@v4
        with:
          name: macos-stem-runtime-${{ matrix.rid }}
          path: stem-runtime-${{ matrix.rid }}.tgz
          if-no-files-found: error

  unity-player:
    name: Unity macOS player
    if: ${{ inputs.build_unity_player }}
    runs-on: macos-14
    needs:
      - native-plugins
      - stem-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install private Unity assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_ASSET_TAG: ci-private-assets
          MIDIPLAYER_SHA256: b75288fdfbc2dbb1ca199ed033ebbfad79fa979f830cd02f4f4873e03706f6d6
          RELEASE_ASSETS_SHA256: a6e8328bb260d6d83ca4aa33a69f3cc68d2a12b7a212be6bd72389533547959f
        run: |
          mkdir -p Temp/private-unity-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          tag = os.environ["PRIVATE_ASSET_TAG"]
          assets = {
              "MidiPlayer.zip": os.environ["MIDIPLAYER_SHA256"].lower(),
              "StringTheoryReleaseAssets.zip": os.environ["RELEASE_ASSETS_SHA256"].lower(),
          }
          out_dir = pathlib.Path("Temp/private-unity-assets")

          def github_request(url, accept="application/vnd.github+json"):
              request = urllib.request.Request(url)
              request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Accept", accept)
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              request.add_header("User-Agent", "StringTheoryMacOSBuild")
              return urllib.request.urlopen(request, timeout=120)

          with github_request(f"https://api.github.com/repos/{repo}/releases/tags/{tag}") as response:
              release = json.load(response)

          release_assets = {item.get("name"): item for item in release.get("assets", [])}
          for asset_name, expected_sha in assets.items():
              asset = release_assets.get(asset_name)
              if asset is None:
                  raise SystemExit(f"Private release asset {asset_name} was not found.")

              with github_request(asset["url"], accept="application/octet-stream") as response:
                  data = response.read()

              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"{asset_name} SHA256 mismatch: expected {expected_sha}, got {actual_sha}"
                  )

              out_path = out_dir / asset_name
              out_path.write_bytes(data)
              print(f"Downloaded {asset_name} ({len(data)} bytes, sha256 {actual_sha})")
          PY
          rm -rf Assets/MidiPlayer
          unzip -oq Temp/private-unity-assets/MidiPlayer.zip -d Assets
          test -f Assets/MidiPlayer/Scripts/MidiPlayer.Run.asmdef
          unzip -oq Temp/private-unity-assets/StringTheoryReleaseAssets.zip -d .
          test -f Assets/Resources/Hero.png
          test -d Assets/StreamingAssets/Songs
          find Assets/StreamingAssets/Songs -mindepth 1 -maxdepth 1 | grep -q .

      - name: Download native plugins
        uses: actions/download-artifact@v4
        with:
          name: macos-native-plugins
          path: Temp/macos-native-plugins

      - name: Install native plugins
        shell: bash
        run: |
          mkdir -p Assets/Plugins/macOS
          tar -xzf Temp/macos-native-plugins/macos-native-plugins.tgz -C Assets/Plugins/macOS
          chmod +x Assets/Plugins/macOS/*.dylib
          ls -lh Assets/Plugins/macOS

      - name: Download stem runtime
        uses: actions/download-artifact@v4
        with:
          pattern: macos-stem-runtime-*
          path: Temp/macos-stem-runtime-artifacts
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Prepare macOS streaming assets
        shell: bash
        run: |
          mkdir -p Assets/StreamingAssets/StemSeparator Temp/macos-stem-runtime-universal
          rm -f Assets/StreamingAssets/StemSeparator/stem-separator-runtime-macos-universal.zip
          for archive in Temp/macos-stem-runtime-artifacts/stem-runtime-*.tgz; do
            tar -xzf "${archive}" -C Temp/macos-stem-runtime-universal
          done
          test -x Temp/macos-stem-runtime-universal/osx-arm64/python/bin/python3
          test -x Temp/macos-stem-runtime-universal/osx-x64/python/bin/python3
          (
            cd Temp/macos-stem-runtime-universal
            zip -qry "$GITHUB_WORKSPACE/Assets/StreamingAssets/StemSeparator/stem-separator-runtime-macos-universal.zip" osx-arm64 osx-x64
          )
          ls -lh Assets/StreamingAssets/StemSeparator/stem-separator-runtime-macos-universal.zip

          install_macos_import_decoder_tools() {
            local rid="$1"
            local target_dir="$2"
            local tools_dir="${target_dir}/Tools"
            local ffmpeg_url=""
            local ffmpeg_sha=""
            local rid_arch=""

            case "${rid}" in
              osx-arm64)
                rid_arch="arm64"
                ffmpeg_url="https://www.osxexperts.net/ffmpeg81arm.zip"
                ffmpeg_sha="ebb82529562b71170807bbc6b0e7eb4f0b13af8cbb0e085bb9e8f6fe709598ad"
                ;;
              osx-x64)
                rid_arch="x86_64"
                ffmpeg_url="https://evermeet.cx/ffmpeg/ffmpeg-8.1.1.zip"
                ffmpeg_sha="4610988e2f54c243c50da73a09e4e2c36d9bb77546f9aa6c84cb328dcb1a98c1"
                ;;
              *)
                echo "Unsupported Rocksmith import RID: ${rid}" >&2
                exit 1
                ;;
            esac

            mkdir -p "${tools_dir}"

            local download_dir="Temp/macos-import-tools/${rid}"
            rm -rf "${download_dir}"
            mkdir -p "${download_dir}"

            local ffmpeg_zip="${download_dir}/ffmpeg.zip"
            curl -sL --fail --retry 5 --retry-delay 5 --retry-all-errors "${ffmpeg_url}" -o "${ffmpeg_zip}"
            local actual_sha
            actual_sha="$(shasum -a 256 "${ffmpeg_zip}" | awk '{print $1}')"
            if [[ "${actual_sha}" != "${ffmpeg_sha}" ]]; then
              echo "ffmpeg SHA256 mismatch for ${rid}" >&2
              echo "expected: ${ffmpeg_sha}" >&2
              echo "actual:   ${actual_sha}" >&2
              exit 1
            fi

            local ffmpeg_extract="${download_dir}/ffmpeg"
            mkdir -p "${ffmpeg_extract}"
            unzip -q "${ffmpeg_zip}" -d "${ffmpeg_extract}"
            local ffmpeg_bin
            ffmpeg_bin="$(find "${ffmpeg_extract}" -type f -name ffmpeg -not -path '*/__MACOSX/*' | head -n 1)"
            if [[ -z "${ffmpeg_bin}" ]]; then
              echo "ffmpeg binary not found in ${ffmpeg_url}" >&2
              exit 1
            fi
            cp "${ffmpeg_bin}" "${tools_dir}/ffmpeg"

            local vgmstream_zip="${download_dir}/vgmstream.zip"
            local vgmstream_url="https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-mac.zip"
            local vgmstream_sha="cdabf633231a4556feb0048a71990c768e862f3695dd9458ae28e4d94aa50a99"
            curl -sL --fail --retry 5 --retry-delay 5 --retry-all-errors \
              "${vgmstream_url}" \
              -o "${vgmstream_zip}"
            actual_sha="$(shasum -a 256 "${vgmstream_zip}" | awk '{print $1}')"
            if [[ "${actual_sha}" != "${vgmstream_sha}" ]]; then
              echo "vgmstream SHA256 mismatch" >&2
              echo "expected: ${vgmstream_sha}" >&2
              echo "actual:   ${actual_sha}" >&2
              exit 1
            fi

            local vgmstream_extract="${download_dir}/vgmstream"
            mkdir -p "${vgmstream_extract}"
            unzip -q "${vgmstream_zip}" -d "${vgmstream_extract}"
            local vgmstream_bin
            vgmstream_bin="$(find "${vgmstream_extract}" -type f -name vgmstream-cli -not -path '*/__MACOSX/*' | head -n 1)"
            if [[ -z "${vgmstream_bin}" ]]; then
              echo "vgmstream-cli binary not found in vgmstream-mac.zip" >&2
              exit 1
            fi
            cp "${vgmstream_bin}" "${tools_dir}/vgmstream-cli"

            chmod +x "${tools_dir}/ffmpeg" "${tools_dir}/vgmstream-cli"
            xattr -d com.apple.quarantine "${tools_dir}/ffmpeg" 2>/dev/null || true
            xattr -d com.apple.quarantine "${tools_dir}/vgmstream-cli" 2>/dev/null || true
            codesign --force --sign - "${tools_dir}/ffmpeg" "${tools_dir}/vgmstream-cli"

            local host_arch
            host_arch="$(uname -m)"
            if [[ "${host_arch}" == "${rid_arch}" ]]; then
              "${tools_dir}/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -wq libvorbis
              if ! "${tools_dir}/vgmstream-cli" --help >"${download_dir}/vgmstream-help.txt" 2>&1; then
                if ! grep -iq vgmstream "${download_dir}/vgmstream-help.txt"; then
                  cat "${download_dir}/vgmstream-help.txt"
                  exit 1
                fi
              fi
            else
              echo "Skipping ${rid} decoder smoke test on ${host_arch} runner."
            fi
          }

          python3 -m pip install --no-deps --target Temp/basic-pitch-model basic-pitch==0.4.0
          MODEL_PATH="$(find Temp/basic-pitch-model \( -name 'basic_pitch_nmp.onnx' -o -name 'nmp.onnx' \) -type f | head -n 1)"
          if [[ -z "${MODEL_PATH}" ]]; then
            echo "The Basic Pitch ONNX model was not found in the basic-pitch package." >&2
            exit 1
          fi
          mkdir -p Assets/StreamingAssets/NotesReader/Models
          cp "${MODEL_PATH}" Assets/StreamingAssets/NotesReader/Models/basic_pitch_nmp.onnx

          mkdir -p Temp/UnityManagedDeps
          cat > Temp/UnityManagedDeps/UnityManagedDeps.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="AlphaTab" Version="1.6.0-alpha.1444" />
              <PackageReference Include="AlphaSkia" Version="3.3.135" />
              <PackageReference Include="System.Drawing.Common" Version="9.0.5" />
              <PackageReference Include="Microsoft.Win32.SystemEvents" Version="9.0.5" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore Temp/UnityManagedDeps/UnityManagedDeps.csproj /p:NuGetAudit=false
          mkdir -p Assets/Plugins/Managed
          cp "$HOME/.nuget/packages/alphatab/1.6.0-alpha.1444/lib/netstandard2.0/AlphaTab.dll" Assets/Plugins/Managed/AlphaTab.dll
          cp "$HOME/.nuget/packages/alphaskia/3.3.135/lib/netstandard2.0/AlphaSkia.dll" Assets/Plugins/Managed/AlphaSkia.dll
          cp "$HOME/.nuget/packages/system.drawing.common/9.0.5/lib/netstandard2.0/System.Drawing.Common.dll" Assets/Plugins/Managed/System.Drawing.Common.dll
          cp "$HOME/.nuget/packages/microsoft.win32.systemevents/9.0.5/lib/netstandard2.0/Microsoft.Win32.SystemEvents.dll" Assets/Plugins/Managed/Microsoft.Win32.SystemEvents.dll
          ls -lh Assets/Plugins/Managed/*.dll

          for rid in osx-arm64 osx-x64; do
            dotnet publish Tools/AlphaTabRenderHelper/AlphaTabRenderHelper.csproj \
              -c Release \
              -r "${rid}" \
              --self-contained true \
              -o "Assets/StreamingAssets/AlphaTabRenderHelper/${rid}"
            chmod +x "Assets/StreamingAssets/AlphaTabRenderHelper/${rid}/AlphaTabRenderHelper"
          done

          if [[ ! -d External/Rocksmith2014.NET ]]; then
            git clone https://github.com/iminashi/Rocksmith2014.NET External/Rocksmith2014.NET
            git -C External/Rocksmith2014.NET checkout b87c9a3afd31c40ade9685a9244e718e7581c0cb
          fi

          for rid in osx-arm64 osx-x64; do
            dotnet publish External/RocksmithImportTool/RocksmithImportTool.csproj \
              -c Release \
              -f net10.0 \
              -r "${rid}" \
              --self-contained true \
              /p:UseRocksmithNet10=true \
              /p:NuGetAudit=false \
              -o "Assets/StreamingAssets/RocksmithImport/${rid}"
            chmod +x "Assets/StreamingAssets/RocksmithImport/${rid}/RocksmithImportTool"
            install_macos_import_decoder_tools "${rid}" "Assets/StreamingAssets/RocksmithImport/${rid}"
          done

      - name: Stage macOS LV2 plugins
        shell: bash
        env:
          MACOS_ARCHS: ${{ inputs.macos_archs }}
        run: bash Tools/Mac/stage-macos-lv2.sh

      - name: Resolve Unity macOS architecture
        id: macos-unity-arch
        shell: bash
        run: |
          case "${{ inputs.macos_archs }}" in
            "x86_64;arm64")
              echo "value=x64ARM64" >> "$GITHUB_OUTPUT"
              ;;
            "arm64")
              echo "value=ARM64" >> "$GITHUB_OUTPUT"
              ;;
            "x86_64")
              echo "value=x64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported macOS architecture selection: ${{ inputs.macos_archs }}" >&2
              exit 1
              ;;
          esac

      - name: Build Unity player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          MACOS_UNITY_ARCHITECTURE: ${{ steps.macos-unity-arch.outputs.value }}
          STRINGTHEORY_SKIP_ADHOC_MAC_SIGNING: true
        with:
          projectPath: .
          unityVersion: 6000.2.9f1
          targetPlatform: StandaloneOSX
          versioning: None
          buildsPath: build
          buildName: StringTheory
          buildMethod: StringTheoryBuildAutomation.BuildMacOS
          customParameters: -macOSArchitecture ${{ steps.macos-unity-arch.outputs.value }} -buildOutput build/StringTheory-macOS/StringTheory.app

      - name: Import Developer ID certificate
        id: developer-id
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [[ -z "${MACOS_CERTIFICATE_P12}" && -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "Developer ID signing secrets are not configured. Keeping ad-hoc signed macOS artifact."
            exit 0
          fi

          if [[ -z "${MACOS_CERTIFICATE_P12}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "Both MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD must be configured." >&2
            exit 1
          fi

          keychain_password="$(uuidgen)"
          keychain_path="${RUNNER_TEMP}/stringtheory-signing.keychain-db"
          p12_path="${RUNNER_TEMP}/developer-id.p12"

          if ! echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${p12_path}" 2>/dev/null; then
            echo "${MACOS_CERTIFICATE_P12}" | base64 -D > "${p12_path}"
          fi
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${p12_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          identity="$(security find-identity -v -p codesigning "${keychain_path}" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "${identity}" ]]; then
            security find-identity -v -p codesigning "${keychain_path}" || true
            echo "Developer ID Application identity was not found in imported certificate." >&2
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "keychain=${keychain_path}" >> "$GITHUB_OUTPUT"
          echo "Imported ${identity}"

      - name: Developer ID sign and notarize Unity player
        if: steps.developer-id.outputs.configured == 'true'
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ steps.developer-id.outputs.identity }}
          MACOS_SIGNING_KEYCHAIN: ${{ steps.developer-id.outputs.keychain }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_TEAM_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" ]]; then
            echo "APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_SPECIFIC_PASSWORD are required for notarization." >&2
            exit 1
          fi

          bash Tools/Mac/sign-and-notarize-app.sh \
            build/StringTheory-macOS/StringTheory.app \
            StringTheory-macOS.zip

      - name: Pack Unity player for distribution
        if: steps.developer-id.outputs.configured != 'true'
        shell: bash
        run: |
          test -d build/StringTheory-macOS/StringTheory.app
          codesign --verify --deep --strict --verbose=2 build/StringTheory-macOS/StringTheory.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/StringTheory-macOS/StringTheory.app \
            StringTheory-macOS.zip
          ls -lh StringTheory-macOS.zip

      - name: Upload Unity player
        uses: actions/upload-artifact@v4
        with:
          name: StringTheory-macOS
          path: StringTheory-macOS.zip
          if-no-files-found: error

      - name: Upload stem runtime package
        uses: actions/upload-artifact@v4
        with:
          name: macos-stem-runtime-package
          path: Assets/StreamingAssets/StemSeparator/stem-separator-runtime-macos-universal.zip
          if-no-files-found: error
